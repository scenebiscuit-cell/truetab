# Every Monday morning, open a GitHub issue listing what to check by hand this week.
# Step 1 fetches monthly government price data (api.bls.gov only) to spot ingredient and restaurant
# price jumps. Step 2 reads only TrueTab's own data file plus that price data; it never visits a
# restaurant's site or any app. If step 1 fails, the issue still opens, with a 30-day schedule.
# Run it any time from the repo's Actions tab: "Weekly price check" -> "Run workflow".
# Optional: add a free BLS API key as the repository secret BLS_API_KEY for higher limits.
name: Weekly price check

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (8 am in Austin in winter, 9 am in summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch monthly price data (U.S. Bureau of Labor Statistics)
        continue-on-error: true
        run: node scripts/fetch-market.js market.json
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

      - name: Write this week's checklist
        run: node scripts/weekly-check.js --market market.json --title-file title.txt --body-file body.md
        env:
          SITE_URL: https://scenebiscuit.com/truetab/

      - name: Replace last week's issue with this week's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create weekly-check --color 1d6a43 --description "Weekly hand price check" --force
          for n in $(gh issue list --label weekly-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Replaced by this week's checklist."
          done
          gh issue create --title "$(cat title.txt)" --body-file body.md --label weekly-check
